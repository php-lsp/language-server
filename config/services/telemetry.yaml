parameters:
  # Env-var defaults (overridable via .env, .env.local, or shell environment)
  env(OTEL_EXPORTER_OTLP_ENDPOINT): ''
  env(OTEL_SERVICE_NAME): 'php-lsp'

  app.telemetry.endpoint: '%env(OTEL_EXPORTER_OTLP_ENDPOINT)%'
  app.telemetry.service_name: '%env(OTEL_SERVICE_NAME)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Module\Telemetry\TracerFactory:
    arguments:
      $endpoint: '%app.telemetry.endpoint%'
      $serviceName: '%app.telemetry.service_name%'

  App\Module\Telemetry\TracerInterface:
    factory: ['@App\Module\Telemetry\TracerFactory', 'create']
